name: guard

# Thin caller: the guard logic (also require the head repo to be the base repo,
# so a fork branch named "develop" cannot pass) lives in the reusable so every
# repo gets the same rule. The pull_request trigger must live here. Keep the job
# id "develop-only" so the required check is "develop-only / develop-only".

on:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  develop-only:
    uses: Glyndor/.github/.github/workflows/main-guard.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
