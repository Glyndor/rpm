name: Workflow lint

# Lints this repository's own workflow YAML (actionlint + shellcheck on the
# run: blocks), so a broken caller or a bug in a workflow script fails the PR
# rather than surfacing later. The reusable pins the linters.

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: Glyndor/.github/.github/workflows/workflow-lint.yml@b12b4c0bb5c2caec50ea8e46a21a5c0519b73ad9 # v1.10.0
