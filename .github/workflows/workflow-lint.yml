name: Workflow lint

# Lints this repository's own workflow YAML (actionlint + shellcheck on the
# run: blocks), so a broken caller or a bug in a workflow script fails the PR
# rather than surfacing later. The reusable pins the linters.

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: Glyndor/.github/.github/workflows/workflow-lint.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
